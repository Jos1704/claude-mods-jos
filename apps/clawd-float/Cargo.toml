[package]
name = "clawd-float"
version = "0.1.0"
edition = "2021"
description = "Clawd flotante: muestra en el escritorio lo que Claude Code está haciendo"

[dependencies]
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
strip = true
